name: Build and Release APK
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]*'
      - 'v*'

jobs:
  build-go:
    name: Build Иггстэк (go engine + custom yggdrasil-go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize lib/yggstack submodule over HTTPS
        run: |
          git config --file=.gitmodules submodule."lib/yggstack".url https://github.com/DrewCyber/yggstack.git
          git submodule sync
          git submodule update --init lib/yggstack

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          mkdir -p "$(go env GOPATH)/pkg/gomobile"

      - name: Install NDK 28.2.13676358
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Get version
        id: get_version
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == "main" || "$REF" == "develop" || "$REF" == "master" ]]; then
            APP_VERSION="0.5.15.1-alpha2"
          else
            APP_VERSION="${REF#v}"
          fi
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "Building go flavor version: ${APP_VERSION}"

      - name: Build yggstack AAR with lespromtehkms/yggdrasil-go
        run: |
          cd lib/yggstack
          export GONOPROXY="github.com/lespromtehkms/*"
          export GONOSUMDB="github.com/lespromtehkms/*"
          echo "Replacing yggdrasil-go with github.com/lespromtehkms/yggdrasil-go@develop..."
          go mod edit -replace github.com/yggdrasil-network/yggdrasil-go=github.com/lespromtehkms/yggdrasil-go@develop
          go mod tidy
          grep "lespromtehkms/yggdrasil-go" go.mod
          chmod +x mobile/build-android.sh
          echo "Building production AAR with stripped symbols..."
          ./mobile/build-android.sh
          echo "AAR built successfully:"
          ls -lh android-build/yggstack.aar
          mkdir -p ../../app/libs/
          cp android-build/yggstack.aar ../../app/libs/

      - name: Ensure app name is Иггстэк in all locales
        run: |
          sed -i 's|<string name="app_name"[^>]*>.*</string>|<string name="app_name" translatable="false">Иггстэк</string>|g' app/src/main/res/values*/strings.xml
          sed -i 's|<string name="peer_uri_hint"[^>]*>.*</string>|<string name="peer_uri_hint">tcp://, tls://, quic://, ws://, socks://, sockstls://, http://, httptls://</string>|g' app/src/main/res/values*/strings.xml

      - name: Download latest publicnodes.json for bundled asset
        run: |
          curl -fsSL --max-time 15 https://publicpeers.neilalexander.dev/publicnodes.json \
            -o app/src/main/assets/publicnodes.json \
          || curl -fsSL --max-time 15 https://peers.yggdrasil.link/publicnodes.json \
            -o app/src/main/assets/publicnodes.json \
          || echo "All mirrors unavailable; keeping committed publicnodes.json"
          echo "Bundled publicnodes.json size: $(wc -c < app/src/main/assets/publicnodes.json) bytes"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache signing keystore
        uses: actions/cache@v6
        with:
          path: release.keystore
          key: yggstack-alpha2-release-keystore-v1

      - name: Generate signing keystore if missing
        run: |
          if [ ! -f "${{ github.workspace }}/release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/release.keystore" \
              -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=lespromtehkms, OU=Yggdrasil, O=Yggstack, L=Komsomolsk, S=Khabarovsk, C=RU"
          fi

      - name: Build Release APK (go)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: release
          KEY_PASSWORD: android
        run: ./gradlew assembleGoRelease

      - name: Rename APKs
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          cd app/build/outputs/apk/go/release

          mv app-go-arm64-v8a-release.apk yggstack-${VERSION}-arm64-v8a.apk
          mv app-go-armeabi-v7a-release.apk yggstack-${VERSION}-armeabi-v7a.apk
          mv app-go-x86-release.apk yggstack-${VERSION}-x86.apk
          mv app-go-x86_64-release.apk yggstack-${VERSION}-x86_64.apk
          mv app-go-universal-release.apk yggstack-${VERSION}-universal.apk

          ls -lh

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: yggstack-alpha2-apks
          path: app/build/outputs/apk/go/release/yggstack-*.apk

  release:
    name: Create release
    needs: [build-go]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download go APKs
        uses: actions/download-artifact@v8
        with:
          name: yggstack-alpha2-apks
          path: dist

      - name: List release artifacts
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/yggstack-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
